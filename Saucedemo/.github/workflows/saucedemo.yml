name: Saucedemo Automation Tests

on:
  push:
    branches: [ main, playwright ]
  pull_request:
    branches: [ main, playwright ]
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./Saucedemo
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./Saucedemo
        run: npx playwright install --with-deps

      - name: Run local tests
        working-directory: ./Saucedemo
        run: npx playwright test --reporter=html,json

      - name: Run Sauce Labs tests
        working-directory: ./Saucedemo
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        run: npx saucectl run

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: Saucedemo/playwright-report/
          retention-days: 30

      - name: Upload test results (JSON)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: Saucedemo/test-results/
          retention-days: 30

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Saucedemo Test Results
          path: Saucedemo/test-results/*.json
          reporter: 'java-junit'
